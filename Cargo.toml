[package]
name = "statusline"
version = "0.5.2"
edition = "2021"
build = "build.rs"

[dependencies]
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
ron = "0.8"
unicode-width = { version = "0.2", default-features = false }

[build-dependencies]
serde = { version = "1", default-features = false, features = ["std", "derive"] }
ron = "0.8"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
