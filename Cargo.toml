[package]
name = "statusline"
version = "1.0.1"
edition = "2021"
build = "build.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.8"
unicode-width = { version = "0.2", default-features = false }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
ron = "0.8"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
