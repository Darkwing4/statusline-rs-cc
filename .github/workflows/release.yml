name: ci and release

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create (e.g. v0.1.0)'
        required: true

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: check formatting
        run: cargo fmt --all -- --check

      - name: lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: test
        run: cargo test --locked

  build:
    needs: quality
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            linker: aarch64-linux-gnu-gcc
            apt: gcc-aarch64-linux-gnu
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            windows: true
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            windows: true
    steps:
      - uses: actions/checkout@v4

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: install cross linker
        if: matrix.apt
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}

      - name: configure cross linker
        if: matrix.linker
        run: |
          mkdir -p .cargo
          cat >> .cargo/config.toml <<EOF
          [target.${{ matrix.target }}]
          linker = "${{ matrix.linker }}"
          EOF

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: package
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.windows }}" = "true" ]; then
            asset="statusline-${{ matrix.target }}.zip"
            (cd target/${{ matrix.target }}/release && 7z a "../../../dist/$asset" statusline.exe >/dev/null)
          else
            asset="statusline-${{ matrix.target }}.tar.gz"
            tar -C target/${{ matrix.target }}/release -czf "dist/$asset" statusline
          fi
          (cd dist && sha256sum "$asset" > "$asset.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: statusline-${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
