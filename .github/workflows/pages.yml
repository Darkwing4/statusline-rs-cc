name: pages

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: generate the segment catalogue
        run: cargo run --locked -- --schema > site/segment-catalog.json

      - name: install node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site-cljs/package-lock.json

      - name: check site assets
        run: |
          for file in site/*.js; do node --check "$file"; done
          node --test site/*.test.js
          node site/every-segment-ron.js > "$RUNNER_TEMP/every-segment.ron"
          target/debug/statusline --check-config "$RUNNER_TEMP/every-segment.ron"

      - name: install java for shadow-cljs
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/cache@v4
        with:
          path: ~/.m2
          key: m2-${{ hashFiles('site-cljs/shadow-cljs.edn', 'site-cljs/package-lock.json') }}

      - name: build and check the clojurescript site
        working-directory: site-cljs
        run: |
          npm ci
          npm run assets
          npx shadow-cljs release app
          npx shadow-cljs compile test
          node out/test.js
          npx shadow-cljs compile every-segment-ron
          node out/every-segment-ron.js > "$RUNNER_TEMP/every-segment-cljs.ron"
          diff "$RUNNER_TEMP/every-segment.ron" "$RUNNER_TEMP/every-segment-cljs.ron"
          ../target/debug/statusline --check-config "$RUNNER_TEMP/every-segment-cljs.ron"
          rm -rf ../site/cljs
          cp -r public ../site/cljs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: deploy
        id: deploy
        uses: actions/deploy-pages@v4
