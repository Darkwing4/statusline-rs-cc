name: pages

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: generate the segment catalogue
        run: cargo run --locked -- --schema > site/segment-catalog.json

      - name: install node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: install java for shadow-cljs
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: install clojure quality tools
        uses: DeLaGuardo/setup-clojure@13.7
        with:
          bb: '1.13.219'
          cljfmt: '0.16.5'
          clj-kondo: '2026.08.04'

      - name: check clojure code
        working-directory: site
        run: bb check

      - uses: actions/cache@v4
        with:
          path: ~/.m2
          key: m2-${{ hashFiles('site/shadow-cljs.edn', 'site/package-lock.json') }}

      - name: build and check the site
        working-directory: site
        run: |
          npm ci
          npm run assets
          npx shadow-cljs release app
          npx shadow-cljs compile test
          node out/test.js
          npx shadow-cljs compile every-segment-ron
          node out/every-segment-ron.js > "$RUNNER_TEMP/every-segment.ron"
          ../target/debug/statusline --check-config "$RUNNER_TEMP/every-segment.ron"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

      - name: deploy
        id: deploy
        uses: actions/deploy-pages@v4
